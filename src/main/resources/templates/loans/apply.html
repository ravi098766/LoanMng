<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Loan - Loan Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/dashboard}">
            <div class="brand-icon me-2"><i class="bi bi-bank2 text-primary fs-4"></i></div>
            <span>Loan<span class="text-primary">Mng</span></span>
        </a>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/loans}"><i class="bi bi-cash-stack me-1"></i> My Loans</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/loans/apply}"><i class="bi bi-plus-circle me-1"></i> Apply Loan</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/payments}"><i class="bi bi-receipt me-1"></i> Payments</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/calculator}"><i class="bi bi-calculator me-1"></i> EMI Calculator</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-primary text-white p-4 rounded-top-4">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-white text-primary rounded-3 p-3 me-3">
                            <i class="bi bi-file-earmark-text fs-2"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1">New Loan Application</h3>
                            <p class="mb-0 text-white-50">Fill in the loan parameters to calculate your EMI and submit.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/loans/apply}" th:object="${loanDto}" method="post">
                        <!-- Loan Type -->
                        <div class="mb-4">
                            <label for="loanType" class="form-label fw-semibold">Loan Category</label>
                            <select class="form-select form-select-lg" th:field="*{loanType}" id="loanType">
                                <option value="Personal Loan" data-rate="10.0">Personal Loan (10.0% p.a.)</option>
                                <option value="Home Loan" data-rate="8.5">Home Loan (8.5% p.a.)</option>
                                <option value="Auto Loan" data-rate="9.0">Auto / Vehicle Loan (9.0% p.a.)</option>
                                <option value="Education Loan" data-rate="7.5">Education Loan (7.5% p.a.)</option>
                                <option value="Business Loan" data-rate="11.5">Business Loan (11.5% p.a.)</option>
                            </select>
                        </div>

                        <!-- Loan Amount -->
                        <div class="mb-4">
                            <label for="amount" class="form-label fw-semibold">Required Loan Amount (₹)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">₹</span>
                                <input type="number"
                                       class="form-control"
                                       th:field="*{amount}"
                                       id="amount"
                                       min="1000"
                                       max="10000000"
                                       step="1000"
                                       required>
                            </div>
                            <div class="invalid-feedback d-block text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <!-- Tenure Months -->
                        <div class="mb-4">
                            <label for="tenureMonths" class="form-label fw-semibold">Loan Tenure (Months)</label>
                            <select class="form-select form-select-lg" th:field="*{tenureMonths}" id="tenureMonths">
                                <option value="6">6 Months (Half year)</option>
                                <option value="12">12 Months (1 Year)</option>
                                <option value="24">24 Months (2 Years)</option>
                                <option value="36">36 Months (3 Years)</option>
                                <option value="48">48 Months (4 Years)</option>
                                <option value="60">60 Months (5 Years)</option>
                                <option value="120">120 Months (10 Years)</option>
                                <option value="240">240 Months (20 Years)</option>
                            </select>
                            <div class="invalid-feedback d-block text-danger" th:if="${#fields.hasErrors('tenureMonths')}" th:errors="*{tenureMonths}"></div>
                        </div>

                        <!-- Live Calculation Widget -->
                        <div class="card bg-light border-0 p-4 rounded-3 mb-4">
                            <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-calculator me-1"></i> Estimated Repayment Summary</h6>
                            <div class="row text-center">
                                <div class="col-4 border-end">
                                    <span class="text-muted small">Estimated EMI</span>
                                    <h4 class="text-primary fw-bold mb-0" id="previewEmi">₹0</h4>
                                </div>
                                <div class="col-4 border-end">
                                    <span class="text-muted small">Annual Rate</span>
                                    <h4 class="text-dark fw-bold mb-0" id="previewRate">10%</h4>
                                </div>
                                <div class="col-4">
                                    <span class="text-muted small">Total Payable</span>
                                    <h4 class="text-success fw-bold mb-0" id="previewTotal">₹0</h4>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex gap-3">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-lg w-50">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-lg w-50 shadow-sm">
                                <i class="bi bi-send-check me-2"></i> Submit Application
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateLoanCalc() {
        const typeSelect = document.getElementById('loanType');
        const selectedOption = typeSelect.options[typeSelect.selectedIndex];
        const rate = parseFloat(selectedOption.getAttribute('data-rate')) || 10.0;
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const tenure = parseInt(document.getElementById('tenureMonths').value) || 12;

        document.getElementById('previewRate').textContent = rate + '%';

        if (amount > 0 && tenure > 0) {
            const monthlyRate = (rate / 12) / 100;
            const factor = Math.pow(1 + monthlyRate, tenure);
            const emi = (amount * monthlyRate * factor) / (factor - 1);
            const total = emi * tenure;

            document.getElementById('previewEmi').textContent = '₹' + emi.toFixed(2);
            document.getElementById('previewTotal').textContent = '₹' + total.toFixed(2);
        } else {
            document.getElementById('previewEmi').textContent = '₹0';
            document.getElementById('previewTotal').textContent = '₹0';
        }
    }

    document.getElementById('loanType').addEventListener('change', updateLoanCalc);
    document.getElementById('amount').addEventListener('input', updateLoanCalc);
    document.getElementById('tenureMonths').addEventListener('change', updateLoanCalc);
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const typeParam = params.get('type');
        const amountParam = params.get('amount');
        const tenureParam = params.get('tenure');

        if (typeParam) {
            const typeSelect = document.getElementById('loanType');
            for (let opt of typeSelect.options) {
                if (opt.value.toLowerCase() === typeParam.toLowerCase()) {
                    typeSelect.value = opt.value;
                    break;
                }
            }
        }
        if (amountParam) {
            document.getElementById('amount').value = amountParam;
        }
        if (tenureParam) {
            const tenureSelect = document.getElementById('tenureMonths');
            if ([...tenureSelect.options].some(o => o.value === tenureParam)) {
                tenureSelect.value = tenureParam;
            }
        }
        updateLoanCalc();
    });
</script>
</body>
</html>
