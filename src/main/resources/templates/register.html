<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Loan Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">

<div class="auth-container register-container">
    <div class="auth-card register-card shadow-lg">
        <!-- Brand Header -->
        <div class="auth-header text-center">
            <div class="brand-logo mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="auth-title">Create an Account</h2>
            <p class="auth-subtitle">Join the Loan Management Platform</p>
        </div>

        <!-- Global Error Notification -->
        <div th:if="${globalError}" class="alert alert-danger d-flex align-items-center alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${globalError}">An error occurred during registration.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm" class="auth-form mt-3" novalidate>
            
            <div class="row g-3">
                <!-- Full Name -->
                <div class="col-12 col-md-6">
                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                        <input type="text"
                               class="form-control"
                               th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                               id="fullName"
                               placeholder="e.g. John Doe"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               id="email"
                               placeholder="john@example.com"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>

                <!-- Mobile Number -->
                <div class="col-12 col-md-6">
                    <label for="mobile" class="form-label">Mobile Number <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel"
                               class="form-control"
                               th:field="*{mobile}"
                               th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid' : ''"
                               id="mobile"
                               placeholder="e.g. 9876543210"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                    </div>
                </div>

                <!-- Address -->
                <div class="col-12 col-md-6">
                    <label for="address" class="form-label">Residential Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <input type="text"
                               class="form-control"
                               th:field="*{address}"
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                               id="address"
                               placeholder="e.g. Sector 4, Belapur"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>
                </div>

                <!-- Account Role -->
                <div class="col-12">
                    <label for="role" class="form-label">Account Role</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                        <select class="form-select" th:field="*{role}" id="role">
                            <option value="CUSTOMER">Borrower / Customer (Apply for loans)</option>
                            <option value="OFFICER">Loan Officer (Review & process loans)</option>
                        </select>
                    </div>
                    <div class="form-text">Choose the role appropriate for your usage.</div>
                </div>

                <!-- Password -->
                <div class="col-12 col-md-6">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               id="password"
                               placeholder="Minimum 6 characters"
                               required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <!-- Password strength helper -->
                    <div class="password-strength-bar mt-1 d-none" id="strengthBar">
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar" id="strengthProgress" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small class="text-muted" id="strengthText"></small>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-12 col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password"
                               class="form-control"
                               th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               id="confirmPassword"
                               placeholder="Repeat password"
                               required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    <small id="passwordMatchMessage" class="form-text"></small>
                </div>
            </div>

            <!-- Terms agreement checkbox -->
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="agreeTerms" required checked>
                <label class="form-check-label text-muted small" for="agreeTerms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm mt-4">
                <i class="bi bi-person-check-fill me-2"></i>Create Account
            </button>
        </form>

        <!-- Divider -->
        <div class="divider my-4">
            <span>OR</span>
        </div>

        <!-- Login Link -->
        <div class="text-center auth-footer">
            <p class="mb-0 text-muted">Already have an account? 
                <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Sign in here</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
